<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad-MA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="200" height="200" rx="100" fill="url(#grad-MA)" />
  <!-- Inner subtle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#6EE7B7" stroke-width="3" stroke-opacity="0.35" />
  <!-- Initials Text -->
  <text x="100" y="114" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1" filter="url(#shadow)">
    MA
  </text>
  <!-- Sub label badge -->
  <rect x="50" y="146" width="100" height="24" rx="12" fill="#065F46" fill-opacity="0.8" stroke="#6EE7B7" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="100" y="162" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="1" text-transform="uppercase">
    GreenHub
  </text>
</svg>