<header class="fixed top-4 left-0 right-0 z-50 px-4">
  <div class="max-w-7xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-white/40 px-6 py-4 flex items-center justify-between transition-all duration-300 hover:shadow-[0_8px_32px_rgba(0,32,77,0.08)]">
    
    <!-- Logo -->
    <div class="flex-shrink-0 cursor-pointer group">
      <a routerLink="/" class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-uel-blue to-[#0052a3] rounded-[14px] flex items-center justify-center shadow-sm group-hover:scale-105 group-hover:shadow-md transition-all duration-300 relative overflow-hidden">
           <!-- Shine effect -->
           <div class="absolute inset-0 bg-gradient-to-tr from-white/0 via-white/20 to-white/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></div>
           <svg xmlns="http://www.w3.org/2000/svg" class="text-white w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-uel-blue tracking-tight leading-none group-hover:text-uel-orange transition-colors duration-300">UEL SPACE</h1>
          <span class="text-[10px] uppercase font-bold text-text-muted/80 tracking-widest mt-0.5 block">Smart Campus</span>
        </div>
      </a>
    </div>
    
    <!-- Navigation -->
    <nav class="hidden lg:flex items-center gap-2">
      <a routerLink="/" routerLinkActive="bg-uel-blue/5 text-uel-blue" [routerLinkActiveOptions]="{exact: true}" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-muted hover:bg-bg-gray hover:text-uel-orange transition-all duration-200 cursor-pointer">Trang chủ</a>
      <a routerLink="/map" routerLinkActive="bg-uel-blue/5 text-uel-blue" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-muted hover:bg-bg-gray hover:text-uel-orange transition-all duration-200 cursor-pointer">Bản đồ</a>
      <a routerLink="/spaces" routerLinkActive="bg-uel-blue/5 text-uel-blue" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-muted hover:bg-bg-gray hover:text-uel-orange transition-all duration-200 cursor-pointer">Không gian</a>
      <a routerLink="/booking" routerLinkActive="bg-uel-blue/5 text-uel-blue" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-muted hover:bg-bg-gray hover:text-uel-orange transition-all duration-200 cursor-pointer">Đặt phòng</a>
      <a routerLink="/about" routerLinkActive="bg-uel-blue/5 text-uel-blue" class="px-4 py-2 rounded-lg text-sm font-semibold text-text-muted hover:bg-bg-gray hover:text-uel-orange transition-all duration-200 cursor-pointer">Về chúng tôi</a>
    </nav>
    
    <!-- Actions -->
    <div class="flex items-center gap-4">
      <button class="relative p-2.5 text-text-muted hover:text-uel-blue bg-bg-gray hover:bg-sky-blue/10 rounded-xl transition-all duration-300 cursor-pointer" aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="absolute top-2 right-2 w-2.5 h-2.5 bg-uel-orange rounded-full border-2 border-white"></span>
      </button>
      
      <button class="flex items-center gap-3 p-1.5 pr-5 bg-white border border-border-gray hover:border-uel-blue/30 rounded-xl transition-all duration-300 group shadow-sm hover:shadow-md cursor-pointer">
        <div class="w-9 h-9 rounded-lg bg-bg-gray flex items-center justify-center text-text-muted group-hover:bg-uel-blue group-hover:text-white transition-colors duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <span class="text-sm font-semibold text-dark-text group-hover:text-uel-blue transition-colors duration-300">Đăng nhập</span>
      </button>
    </div>
  </div>
</header>
