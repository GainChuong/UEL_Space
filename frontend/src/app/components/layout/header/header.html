<header class="bg-white sticky top-0 z-50">
  <div class="max-w-[1440px] mx-auto px-6 h-[88px] flex items-center justify-between">
    
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 cursor-pointer">
      <div class="relative w-10 h-12 flex items-center justify-center">
        <!-- Abstract Cube Logo from image -->
        <svg viewBox="0 0 40 48" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-10 h-12">
          <path d="M20 0L38.453 10.6667V32L20 42.6667L1.547 32V10.6667L20 0Z" fill="#0066CC"/>
          <path d="M20 42.6667V21.3333L1.547 10.6667V32L20 42.6667Z" fill="#0052A3"/>
          <path d="M38.453 10.6667L20 21.3333V42.6667L38.453 32V10.6667Z" fill="#3399FF"/>
          <!-- Orange Pin -->
          <circle cx="28" cy="34" r="5" fill="#FF7900"/>
          <path d="M28 34L25 42L31 42L28 34Z" fill="#FF7900"/>
        </svg>
      </div>
      <div class="flex flex-col ml-1">
        <span class="text-[22px] font-black text-uel-blue leading-[1.1] tracking-tight">UEL</span>
        <span class="text-[22px] font-black text-sky-blue leading-[1.1] tracking-tight">SPACE</span>
      </div>
    </a>
    
    <!-- Navigation -->
    <nav class="hidden lg:flex items-center gap-8 h-full">
      <a routerLink="/" routerLinkActive="text-uel-blue border-b-2 border-uel-blue" [routerLinkActiveOptions]="{exact: true}" class="h-full flex items-center text-[15px] font-bold text-uel-blue border-b-2 border-transparent hover:text-uel-blue transition-colors px-1">Trang chủ</a>
      <a routerLink="/map" routerLinkActive="text-uel-blue border-b-2 border-uel-blue" class="h-full flex items-center text-[15px] font-bold text-dark-text border-b-2 border-transparent hover:text-uel-blue transition-colors px-1">Bản đồ</a>
      <a routerLink="/spaces" routerLinkActive="text-uel-blue border-b-2 border-uel-blue" class="h-full flex items-center text-[15px] font-bold text-dark-text border-b-2 border-transparent hover:text-uel-blue transition-colors px-1">Không gian</a>
      <a routerLink="/booking" routerLinkActive="text-uel-blue border-b-2 border-uel-blue" class="h-full flex items-center text-[15px] font-bold text-dark-text border-b-2 border-transparent hover:text-uel-blue transition-colors px-1">Đặt phòng</a>
      <a routerLink="/about" routerLinkActive="text-uel-blue border-b-2 border-uel-blue" class="h-full flex items-center text-[15px] font-bold text-dark-text border-b-2 border-transparent hover:text-uel-blue transition-colors px-1">Về chúng tôi</a>
    </nav>
    
    <!-- Actions -->
    <div class="flex items-center gap-6">
      <button class="relative text-uel-blue hover:text-sky-blue transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-uel-orange rounded-full border-2 border-white"></span>
      </button>
      
      <div class="w-[1px] h-6 bg-border-gray"></div>
      
      <button class="text-uel-blue hover:text-sky-blue transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 1 0-16 0"></path></svg>
      </button>
    </div>
    
  </div>
</header>
